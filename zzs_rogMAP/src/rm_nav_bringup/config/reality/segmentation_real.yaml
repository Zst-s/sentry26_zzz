ground_segmentation:
  ros__parameters:
    n_threads: 4                # number of threads to use. 地面分割使用的线程数。

    # 自车过滤：仅删除以下三维框内的障碍点，不改变地面分割和原始雷达点云。
    # 以下尺寸仅为示例！按实际车身相对 base_link 的范围确认后再启用。
    self_filter_enabled: false  # 是否启用自车障碍点过滤；false 不过滤，true 删除框内障碍点。
    self_filter_frame: "base_link"  # 过滤框坐标系；xyz 均相对该原点，z 不一定从地面或雷达算起。
    self_filter_min: [-0.32, -0.29, 0.0]  # x/y/z 下界，单位 m
    self_filter_max: [0.30, 0.29, 0.35]    # x/y/z 上界，单位 m；高度需实测
    # TF 不可用时保留原障碍点并警告，避免误删真实障碍物。

    # r_min/r_max 限制地面拟合的水平径向范围，不是删除点云的距离过滤器。
    # 范围外的点未被判为地面时仍会输出为障碍点。
    # 当前节点对 r_min/r_max/max_fit_error 仅 get_parameter，未显式声明；需核对运行时是否采用 YAML 值。
    r_min: 0.7                  #  地面拟合最小水平距离，单位 m。
    r_max: 50                   #  地面拟合最大水平距离，单位 m。
    n_bins: 120                 #  径向分箱数；在有效距离范围内划分距离区间。
    n_segments: 360             # number of radial segments. 水平方向的角度扇区数。

    max_dist_to_line: 0.14       # maximum vertical distance of point to line to be considered ground. 点到拟合地面线的最大竖直距离，单位 m；越大越容易判成地面。

    sensor_height: 0.22         #  输入点云传感器原点的实际离地高度，单位 m，用于估计初始地面高度。
    min_slope: -0.4             #  当前源码按斜率绝对值检查下限；负值使该下限检查不触发，并非下坡角度。
    max_slope: 0.4              #  地面线斜率绝对值上限（高度变化/水平距离变化），不是角度。
    max_fit_error: 0.05         #  拟合最大竖直残差阈值，单位 m；读取后平方，与平方误差比较。
    long_threshold: 1.0         #  相邻拟合点的径向距离间隔超过此值时按长间隔处理，单位 m。
    max_long_height: 0.1        #  长间隔情况下，点相对地面线预测高度的最大偏差，单位 m。
    max_start_height: 0.5       #  开始新地面线时，起始点与估计地面高度的最大差值，单位 m。
    line_search_angle: 0.8      #  本扇区无可用地面线时，搜索邻近扇区的角度范围，单位 rad。

    gravity_aligned_frame: ""   #  重力对齐坐标系；空字符串使用原始点云坐标系，非空时仅旋转点云用于分割，输出仍保留原坐标系。

    latch: false                #  原意为保留最近一帧供新订阅者接收；当前节点未读取此参数，实际使用 SensorDataQoS。
    visualize: false            #  是否启用算法内部可视化，仅调试使用；不控制 RViz 话题发布。

    input_topic: "/livox/lidar/pointcloud"  # 输入雷达点云话题，类型 PointCloud2。
    obstacle_output_topic: "segmentation/obstacle"  # 非地面障碍点云输出；启用自车过滤后不包含过滤框内的障碍点。
    ground_output_topic: "segmentation/ground"  # 地面点云输出，不受自车过滤影响；输出话题使用相对名称，受节点命名空间影响。
